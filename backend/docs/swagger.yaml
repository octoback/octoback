basePath: /
definitions:
  audit.AuditLogPageQuery:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      path:
        type: string
      username:
        type: string
    type: object
  audit.AuditLogPageResult:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      records:
        items:
          $ref: '#/definitions/models.AuditLog'
        type: array
      total:
        type: integer
    type: object
  logic.CreateUserInput:
    properties:
      nickName:
        type: string
      password:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  logic.LoginInput:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  logic.UpdateUserInput:
    properties:
      nickName:
        type: string
      password:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  models.AuditLog:
    properties:
      createdAt:
        type: integer
      duration:
        type: integer
      id:
        type: integer
      ip:
        type: string
      method:
        type: string
      operation:
        type: string
      path:
        type: string
      status:
        type: integer
      userId:
        type: integer
      username:
        type: string
    type: object
  sys.ErrorResponse:
    properties:
      error:
        example: 没有访问权限
        type: string
    type: object
  sys.UserListResponse:
    properties:
      data:
        properties:
          items:
            items:
              additionalProperties: {}
              type: object
            type: array
        type: object
    type: object
  sys.UserResponse:
    properties:
      data:
        additionalProperties: {}
        type: object
    type: object
  sys.batchDeleteInput:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
info:
  contact: {}
  description: OctoBackup 的认证与用户管理 API。
  title: OctoBackup API
  version: "1.0"
paths:
  /api/audit/page:
    post:
      consumes:
      - application/json
      description: 查询当前系统中的用户写操作和认证结果审计记录。
      parameters:
      - description: 分页和筛选条件
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/audit.AuditLogPageQuery'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audit.AuditLogPageResult'
      security:
      - bearerAuth: []
      summary: 查询审计日志
      tags:
      - 审计
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 登录成功后返回有效期默认 7 天的 JWT Bearer token。
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/logic.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: 用户登录
      tags:
      - 认证
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: 注册首个用户会自动授予 admin 角色，后续注册用户为 read 角色。
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/logic.CreateUserInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: 注册用户
      tags:
      - 认证
  /api/plan/run/log:
    post:
      consumes:
      - application/json
      description: 返回全量可读执行日志以及解析后的 Restic summary 对象。
      parameters:
      - description: 运行记录 Id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 查询备份日志详情
      tags:
      - 备份计划
  /api/plugin/instance/forget-snapshot:
    post:
      consumes:
      - application/json
      parameters:
      - description: 仓库插件实例 Id
        in: query
        name: id
        required: true
        type: integer
      - description: Restic 快照 Id
        in: query
        name: snapshotId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 删除仓库中的指定快照
      tags:
      - 插件
  /api/plugin/instance/info:
    post:
      consumes:
      - application/json
      parameters:
      - description: 插件 Id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 获取插件实例详情
      tags:
      - 插件
  /api/plugin/instance/refresh-repository-data:
    post:
      consumes:
      - application/json
      description: 查询 Restic 快照和仓库统计并写入 repository_info，不查询备份 Summary。
      parameters:
      - description: 仓库插件实例 Id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 刷新仓库快照缓存
      tags:
      - 插件
  /api/plugin/instance/snapshot-stats:
    post:
      consumes:
      - application/json
      description: 优先读取备份日志缓存；没有统计时查询 Restic 并写入对应备份日志。
      parameters:
      - description: 仓库插件实例 Id
        in: query
        name: id
        required: true
        type: integer
      - description: Restic 快照 Id
        in: query
        name: snapshotId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 查询单个快照统计
      tags:
      - 插件
  /api/plugin/instance/snapshots:
    post:
      consumes:
      - application/json
      description: 返回 Restic 快照及已存在的备份日志关联；不存在的备份 Summary 不会返回。
      parameters:
      - description: 仓库插件实例 Id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 查询仓库快照
      tags:
      - 插件
  /api/plugin/instance/stats:
    post:
      consumes:
      - application/json
      description: 返回 repository_info 中缓存的仓库统计；缓存缺失时会先刷新仓库数据。
      parameters:
      - description: 仓库插件实例 Id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 查询仓库统计
      tags:
      - 插件
  /api/user/batchDelete:
    post:
      consumes:
      - application/json
      description: 需要 admin 权限。
      parameters:
      - description: 用户 Id 列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/sys.batchDeleteInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
      security:
      - bearerAuth: []
      summary: 批量删除用户
      tags:
      - 用户
  /api/user/create:
    post:
      consumes:
      - application/json
      description: 需要 admin 权限，可设置 admin、write 或 read 角色。
      parameters:
      - description: 用户信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/logic.CreateUserInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/sys.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
      security:
      - bearerAuth: []
      summary: 创建用户
      tags:
      - 用户
  /api/user/delete:
    post:
      description: 需要 admin 权限。
      parameters:
      - description: 用户 Id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
      security:
      - bearerAuth: []
      summary: 删除用户
      tags:
      - 用户
  /api/user/info:
    post:
      description: 需要 read、write 或 admin 权限。
      parameters:
      - description: 用户 Id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sys.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
      security:
      - bearerAuth: []
      summary: 获取用户详情
      tags:
      - 用户
  /api/user/list:
    post:
      description: 需要 read、write 或 admin 权限。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sys.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
      security:
      - bearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户
  /api/user/page:
    post:
      description: 需要 read、write 或 admin 权限。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sys.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
      security:
      - bearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户
  /api/user/update:
    post:
      consumes:
      - application/json
      description: 需要 write 或 admin 权限；非管理员只能更新自己的资料且不能修改角色。
      parameters:
      - description: 用户 Id
        in: query
        name: id
        required: true
        type: integer
      - description: 更新信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/logic.UpdateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sys.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sys.ErrorResponse'
      security:
      - bearerAuth: []
      summary: 更新用户
      tags:
      - 用户
schemes:
- http
securityDefinitions:
  bearerAuth:
    description: 输入 JWT，格式为 "Bearer {token}"。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
