type: repository
name: repository.alioss
title: 阿里云 OSS
description: 使用阿里云对象存储和 Restic S3 后端保存备份
version: 1.0.0
accessType: access.aliyunAccess
fields:
  - key: bucket
    title: Bucket
    type: string
    required: true
  - key: region
    title: 地域
    type: string
    required: true
    helper: 例如 cn-hangzhou
  - key: endpoint
    title: Endpoint
    type: string
    helper: 可选，默认使用该地域的公网 Endpoint
  - key: prefix
    title: 对象前缀
    type: string
    helper: 可选，作为 Bucket 内的仓库目录
  - key: accessId
    title: 阿里云授权
    type: number
    required: true
    component: {name: access-selector}
    mergeScript: 'return { component: { pluginName: "access.aliyunAccess" } }'
  - key: password
    title: Restic 仓库密码
    type: password
    encrypt: true
    required: true
    helper: 设置后不可修改，请务必牢记密码
actions:
  - name: onBuild
    title: 校验仓库配置
    permission: read
